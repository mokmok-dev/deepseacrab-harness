[workspace]
members = [
  "crates/dsh-core",
  "crates/dsh-session",
  "crates/dsh-llm",
  "crates/dsh-tools",
  "crates/dsh-agent",
  "crates/dsh-cli",
  "crates/dsh-jobs",
  "crates/dsh-mcp",
  "crates/dsh-web",
  "crates/dsh-sdk",
  "crates/dsh-schedule",
  "crates/dsh-terminal",
  "crates/dsh-lsp",
  "crates/dsh-sandbox",
  "crates/dsh-team",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
assert_cmd = "2.2.2"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
futures-core = "0.3.34"
futures-util = "0.3.34"
http-body-util = "0.1.3"
glob = "0.3.3"
predicates = "3.1.4"
proptest = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

dsh-core = { path = "crates/dsh-core" }
dsh-session = { path = "crates/dsh-session" }
dsh-llm = { path = "crates/dsh-llm" }
dsh-tools = { path = "crates/dsh-tools" }
dsh-agent = { path = "crates/dsh-agent" }
dsh-jobs = { path = "crates/dsh-jobs" }
dsh-mcp = { path = "crates/dsh-mcp" }
dsh-web = { path = "crates/dsh-web" }
dsh-sdk = { path = "crates/dsh-sdk" }
dsh-schedule = { path = "crates/dsh-schedule" }
dsh-terminal = { path = "crates/dsh-terminal" }
dsh-lsp = { path = "crates/dsh-lsp" }
dsh-sandbox = { path = "crates/dsh-sandbox" }
dsh-team = { path = "crates/dsh-team" }

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "warn"

[workspace.metadata.crane]
name = "deepseacrab-harness"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "2026.11.1"
